name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SerialPortNotifier windows/src/serial_port_notifier.py

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/SerialPortNotifier.exe release/SerialPortNotifier.exe
          Copy-Item LICENSE release/LICENSE.txt
          Copy-Item windows/README.md release/README-Windows.md

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SerialPortNotifier-Windows
          path: release/
          if-no-files-found: error
          retention-days: 90
